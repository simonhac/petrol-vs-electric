# petrol-vs-electric workspace setup/run — driven by @simon/workspace-env.
# Secrets: op inject of the committed .env.tpl (op:// refs into petrol-vs-electric-dev)
# via the Keychain SA token op-sa-petrol-vs-electric-dev.
project: petrol-vs-electric
setup:
  - opInjectEnv           # op inject .env.tpl -> .env.local from 1Password
  - validateEnv           # runs the project's @t3-oss/env schema if configured; else info-skips
  - verify                # node_modules present
run:
  command: pnpm dev
  port: { from: 3020, span: 5 }   # petrol-vs-electric's range 3020–3024
