"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# `pnpm install` bootstraps deps (incl. @simon/workspace-env) before the wrapper
# imports it; then the identical wrapper runs env/workspace.config.yaml's phases.
setup = "pnpm install && npx tsx env/setup.mts"
run = "npx tsx env/run.mts"
run_mode = "concurrent"
